[project]
name = "casa"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
    "edge-tts>=7.0",
    "mcp[cli]<2",
    "pillow>=13.0.0",
    "psutil>=7.2.2",
    "pyautogui>=0.9.54",
    "pycaw>=20260927 ; sys_platform == 'win32'",
    "pychromecast>=14.0.10",
    "uvicorn>=0.54.0",
    "zeroconf>=0.151.5",
]

[project.scripts]
casa = "casa:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
